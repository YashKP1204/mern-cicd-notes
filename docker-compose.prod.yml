version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: notes-mongodb-prod
    restart: always
    volumes:
      - mongo-data-prod:/data/db
    networks:
      - notes-network

  backend:
    image: ash1204/notes-backend:latest
    container_name: notes-backend-prod
    ports:
      - "5000:5000"
    env_file:
      - backend/.env

    depends_on:
      - mongodb
    networks:
      - notes-network
    restart: always

  frontend:
    image: ash1204/notes-frontend:latest
    container_name: notes-frontend-prod
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - notes-network
    restart: always

networks:
  notes-network:
    driver: bridge

volumes:
  mongo-data-prod: